version: 2
sources:
  - name: kailash_sources
    database: TEST_DB
    schema: TEST_SCHEMA
    tables:
      - name: USER
      - name: PERSONS_SAMPLE_FDR
      - name: PAY_MODES
      - name: EMPLOYEE
      - name: EMPLOYEE_BKP
      - name: product_details
      - name: sales_and_costs
      - name: my_2dbtmodel2
      - name: my_1dbtmode11
      - name: PAYMENT_MODES
      - name: orders
        #loaded_at_field: updated_at-->The `loaded_at_field` top-level property should be moved into the `config` of `sources[0].tables[10]`.
      

  - name: raw_sales
    database: your_database_name      # optional (depends on warehouse)
    schema: raw_sales_schema_name     # REQUIRED (warehouse schema)
  

models:
  - name: md_persons_sample
    config:
      materialized: view
  - name: naresh
    config:
      materialized: table

  - name: my_1dbtmodel1
    config:
      materialized: table

  - name: my_2dbtmodel2
    config:
      materialized: table    


  - name: kailashh
    description: "recent data in hiredate column"
    config:
      materialized: table
      freshness:
        warn_after:
          count: 24
          period: hour
        error_after:
          count: 24
          period: hour
    tests:
      - dbt_utils.recency:
          arguments:
            field: hiredate
            datepart: day
            interval: 50















functions:
  - name: fnc_is_positive_int
    description: "Checks if a value is a positive integer."
    code: |
      def is_positive_int(value):
          return isinstance(value, int) and value > 0    
    config:
      schema: udf_schema
      database: udf_db
      volatility: deterministic
    arguments:
      - name: a_string
        data_type: string
        description: The string that I want to check if it's representing a positive integer (like "10") 
        default_value: "'1'"
    returns:
      data_type: integer
