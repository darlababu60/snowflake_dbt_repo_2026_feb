version: 2
sources:
  - name: kailash_sources
    database: TEST_DB
    schema: TEST_SCHEMA
    tables:
      - name: USER
      - name: PERSONS_SAMPLE_FDR
      - name: PAY_MODES
      - name: EMPLOYEE
      - name: EMPLOYEE_BKP
      - name: product_details
      - name: sales_and_costs
      - name: my_2dbtmodel2
      - name: my_1dbtmode11
      - name: PAYMENT_MODES
      - name: orders
        freshness:
          warn_after: {count: 12, period: hour}
          error_after: {count: 24, period: hour}
        loaded_at_field: updated_at

  - name: raw_sales
    database: your_database_name      # optional (depends on warehouse)
    schema: raw_sales_schema_name     # REQUIRED (warehouse schema)
  

models:
  - name: md_persons_sample
    config:
      materialized: view
  - name: naresh
    config:
      materialized: table

  - name: my_1dbtmodel1
    config:
      materialized: table

  - name: my_2dbtmodel2
    config:
      materialized: table

functions:
  - name: is_positive_int       # required
    description: My UDF that returns 1 if a string represents a naked positive integer (like "10", "+8" is not allowed). # optional
    config:
      schema: udf_schema
      database: udf_db
      volatility: deterministic
    arguments:                  # optional
      - name: a_string          # required if arguments is specified
        data_type: string       # required if arguments is specified
        description: The string that I want to check if it's representing a positive integer (like "10") 
        default_value: "'1'"    # optional, available in Snowflake and Postgres
    returns:                    # required
      data_type: integer
# dbt build --select "resource_type:function"
# dbt build --select xyz_abc

    